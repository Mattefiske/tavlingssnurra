<html lang="sv">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tävlingssnurran</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
/* Layout: centered column; the wheel sits on a dark navy "stage" panel, results below as a ranked draw list */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --fg:#101a2e; --muted:#5d6880; --line:#dde2ec;
  --stage:#0c1a36; --stage-2:#13274f; --navy-a:#183262; --navy-b:#1f4080; --navy-c:#2b55a6;
  --gold:#d9a521; --gold-hi:#f3cf63; --on-stage:#f5f7fb; --accent:#1f4080;
  --display:Archivo,"Helvetica Neue",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1b;--surface:#0e1830;--fg:#e9eef8;--muted:#95a2bd;--line:#1e2c4c;--stage:#0a1530;--stage-2:#112349;--accent:#7fa3ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1b;--surface:#0e1830;--fg:#e9eef8;--muted:#95a2bd;--line:#1e2c4c;--stage:#0a1530;--stage-2:#112349;--accent:#7fa3ea;color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.rule{width:48px;height:3px;background:var(--gold);border-radius:2px}
.stagepanel{background:radial-gradient(120% 90% at 50% 20%,var(--stage-2),var(--stage));border-radius:20px;padding:clamp(18px,5vw,36px);display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vw,28px);box-shadow:0 20px 50px -24px rgba(8,18,40,.6)}
.stage{position:relative;width:100%;max-width:460px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-4%;transform:translateX(-50%);width:9%;max-width:42px;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.hub{position:absolute;inset:0;margin:auto;width:36%;height:36%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#e6ebf4 70%);box-shadow:0 0 0 5px var(--gold),0 0 0 7px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box;gap:2px}
.hub small{font-size:clamp(9px,2.2vw,11px);letter-spacing:.14em;text-transform:uppercase;color:#6a7590;font-weight:600}
.ticker{font-family:var(--display);font-weight:700;font-size:clamp(12px,3.2vw,17px);word-break:break-all;line-height:1.15;color:#101a2e}
button.spin{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1405;border:0;border-radius:999px;padding:16px 48px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(217,165,33,.7);transition:transform .15s ease,box-shadow .15s ease}
button.spin:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px -8px rgba(217,165,33,.85)}
button.spin:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.results{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.results h2{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.results ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.results li{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.results li:first-child{border-top:0}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.results li.first .tag{color:var(--gold)}
.uname{font-family:var(--display);font-weight:700;font-size:18px;word-break:break-all;min-width:0}
.results li.first .uname{font-size:22px}
.results a{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.results a:hover{text-decoration:underline}
.empty{color:var(--muted);font-size:14px;margin:0}
/* winner overlay */
.reveal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,10,25,.72);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);color:var(--fg);border-radius:20px;padding:32px 28px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);border-top:4px solid var(--gold);animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.card .tag{color:var(--gold)}
.card .big{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.05;word-break:break-all}
.card .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.ghost{font-family:var(--body);font-weight:600;font-size:14px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;text-decoration:none}
.ghost.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:21;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (max-width:420px){.results li{grid-template-columns:1fr auto}.results li .tag{grid-column:1/-1}}
</style>
</head>

</div>
<div class="reveal" id="reveal" hidden>

  </div>
</div>

}
document.getElementById('rclose').onclick=()=>{document.getElementById('reveal').hidden=true;build();btn.disabled=false;hublbl.textContent='Redo';tick.textContent='Tryck på Snurra';};
document.getElementById('reveal').addEventListener('click',e=>{if(e.target.id==='reveal')document.getElementById('rclose').click();});
function confetti(){
  const c=document.getElementById('confetti'),x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#f3cf63','#d9a521','#ffffff','#2b55a6','#7fa3ea'];
  const ps=Array.from({length:140},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:6+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,W,H);for(const p of ps){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}
    if(now-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(t0);
}
build();
</script>
